---
# Homer reads this file from /www/assets (bind-mounted from this directory).
# Every link is served by Caddy with tls internal on the travel-lab.network
# podman network, so the URLs are the public *.travel-lab.lan names.
title: "Travel Lab"
subtitle: "Raspberry Pi 4"
header: true
footer: false
columns: 2

defaults:
  layout: list
  colorTheme: auto

services:
  - name: "Media"
    icon: "fas fa-film"
    items:
      - name: "Jellyfin"
        subtitle: "Film & TV library"
        icon: "fas fa-play-circle"
        url: "https://jellyfin.travel-lab.lan"
      - name: "Kiwix"
        subtitle: "Offline Wikipedia & more"
        icon: "fas fa-book"
        url: "https://kiwix.travel-lab.lan"

  - name: "Ops"
    icon: "fas fa-heartbeat"
    items:
      - name: "Gatus"
        subtitle: "Uptime monitoring"
        icon: "fas fa-heartbeat"
        url: "https://gatus.travel-lab.lan"
      - name: "Glances"
        subtitle: "System monitor"
        icon: "fas fa-tachometer-alt"
        url: "https://glances.travel-lab.lan"
      - name: "Dozzle"
        subtitle: "Container logs"
        icon: "fas fa-file-code"
        url: "https://dozzle.travel-lab.lan"
      - name: "whoami"
        subtitle: "Test endpoint"
        icon: "fas fa-user-secret"
        url: "https://whoami.travel-lab.lan"
