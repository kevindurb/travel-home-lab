<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Travel TV Remote — Four-tab Layout</title>
<style>
  :root {
    --bg: #080d13;
    --phone: #0b1016;
    --surface: #151d27;
    --surface-2: #1b2633;
    --border: #263241;
    --border-2: #34445a;
    --text: #f2f6fa;
    --muted: #93a4b5;
    --focus: #5cc8ff;
    --ok: #7ee2b8;
    --pad-size: clamp(190px, 30dvh, 260px);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    min-height: 100%;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(circle at 18% 0%, #14202e 0%, var(--bg) 48%),
      var(--bg);
    color: var(--text);
    font-family: "Noto Sans", "DejaVu Sans", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .stage {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 24px;
  }

  /* iPhone 13 mini: 375 x 812 CSS px. On a real phone this frame becomes
     the full dynamic viewport and the safe-area insets apply. */
  .phone {
    position: relative;
    width: min(375px, 100vw);
    height: min(812px, calc(100dvh - 96px));
    overflow: hidden;
    border: 1px solid #2a3545;
    border-radius: 30px;
    background: var(--phone);
    box-shadow:
      0 30px 80px rgba(0, 0, 0, .55),
      0 0 0 8px #10161f;
  }

  .shell {
    height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding-top: env(safe-area-inset-top);
    background:
      radial-gradient(circle at 18% 0%, #162231 0%, var(--phone) 42%);
  }

  /* ---- header ---------------------------------------------------------- */
  .head {
    flex: 0 0 auto;
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 14px;
  }

  .brand {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .22em;
    color: var(--muted);
    white-space: nowrap;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 27px;
    padding: 0 9px;
    border: 1px solid rgba(126, 226, 184, .35);
    border-radius: 999px;
    background: rgba(126, 226, 184, .07);
    color: var(--ok);
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 8px currentColor;
  }

  /* ---- tabs ------------------------------------------------------------ */
  .tabs {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    margin: 0 10px 8px;
    padding: 4px;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: #101822;
  }

  .tab {
    appearance: none;
    min-width: 0;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    cursor: pointer;
  }

  .tab svg {
    width: 15px;
    height: 15px;
    display: block;
  }

  .tab.is-active {
    background: #1d2a3a;
    color: var(--text);
    box-shadow: inset 0 0 0 1px var(--border-2);
  }

  .tab.is-active svg { color: var(--focus); }

  /* ---- panels ---------------------------------------------------------- */
  .panels {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
  }

  .panel {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    padding: 0 12px calc(12px + env(safe-area-inset-bottom));
    overflow: hidden;
  }

  .panel.is-active { display: flex; }

  /* ---- controls (no trackpad) ----------------------------------------- */
  .controls-main {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 6px;
    width: var(--pad-size);
    height: var(--pad-size);
    min-height: 0;
  }

  .key {
    appearance: none;
    min-width: 0;
    min-height: 0;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: linear-gradient(180deg, #1a2431 0%, var(--surface-2) 100%);
    color: var(--text);
    font: inherit;
    font-size: 19px;
    display: grid;
    place-items: center;
    cursor: pointer;
    touch-action: manipulation;
  }

  .key:active { transform: translateY(1px); border-color: var(--focus); }

  .key--ok {
    border-color: var(--focus);
    color: var(--focus);
    font-size: 15px;
    font-weight: 700;
  }

  .quick {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 56px;
    gap: 8px;
    min-height: 0;
  }

  .btn {
    appearance: none;
    min-width: 0;
    min-height: 42px;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: linear-gradient(180deg, #1a2431 0%, var(--surface-2) 100%);
    color: var(--text);
    font: inherit;
    font-size: 11px;
    font-weight: 600;
    padding: 6px 8px;
    cursor: pointer;
    touch-action: manipulation;
  }

  .btn:active { transform: translateY(1px); border-color: var(--focus); }

  .quick .btn {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.1;
  }

  .media {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .media-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .media-row .btn { min-height: 44px; }

  .volume {
    display: flex;
    align-items: center;
    gap: 9px;
    min-height: 30px;
    color: var(--muted);
    font-size: 11px;
  }

  .volume input {
    flex: 1 1 auto;
    min-width: 0;
    height: 30px;
    accent-color: var(--focus);
  }

  .volume output {
    min-width: 34px;
    text-align: right;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ---- shortcuts ------------------------------------------------------- */
  .panel-head {
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 2px 0;
  }

  .eyebrow {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--muted);
  }

  .panel-title {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.1;
  }

  .panel-head .hint {
    font-size: 10px;
    color: var(--muted);
    padding-bottom: 2px;
  }

  .apps {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    grid-auto-rows: 1fr;
    gap: 8px;
  }

  .app {
    appearance: none;
    position: relative;
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 13px;
    background: linear-gradient(180deg, #19222e 0%, var(--surface) 100%);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    padding: 8px;
    cursor: pointer;
    touch-action: manipulation;
    overflow: hidden;
  }

  .app::after {
    content: "↗";
    position: absolute;
    top: 6px;
    right: 8px;
    font-size: 10px;
    font-weight: 400;
    color: var(--muted);
    opacity: .65;
  }

  .app:active {
    transform: translateY(1px);
    border-color: var(--accent);
  }

  /* ---- type ------------------------------------------------------------ */
  .type-form {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .type-compose {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 84px;
    gap: 8px;
  }

  .type-input {
    min-height: 100px;
    height: 100px;
    width: 100%;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    line-height: 1.4;
    padding: 12px;
  }

  .type-input:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 2px rgba(92, 200, 255, .24);
  }

  .type-compose .btn {
    min-height: 100px;
    font-size: 13px;
    line-height: 1.15;
  }

  .btn--primary {
    background: var(--focus);
    border-color: var(--focus);
    color: #08111a;
    font-weight: 800;
  }

  .type-keys {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-auto-rows: minmax(56px, 88px);
    gap: 8px;
    align-content: center;
  }

  .type-keys .btn {
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
  }

  .type-hint {
    flex: 0 0 auto;
    margin: 0;
    font-size: 10px;
    line-height: 1.35;
    color: var(--muted);
    text-align: center;
  }

  /* ---- trackpad tab ---------------------------------------------------- */
  .trackpad {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    border: 1px dashed rgba(147, 164, 181, .42);
    border-radius: 18px;
    background:
      radial-gradient(circle at 50% 50%, rgba(92, 200, 255, .10), transparent 58%),
      radial-gradient(rgba(147, 164, 181, .22) 1px, transparent 1px) 0 0 / 18px 18px,
      var(--surface-2);
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }

  .trackpad.is-active {
    border-color: var(--focus);
    box-shadow: inset 0 0 0 1px var(--focus);
  }

  .trackpad-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .2em;
    color: rgba(147, 164, 181, .55);
  }

  .trackpad-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    padding: 0 14px;
  }

  .trackpad-cursor {
    position: absolute;
    width: 14px;
    height: 14px;
    border: 2px solid var(--focus);
    border-radius: 50%;
    background: rgba(92, 200, 255, .25);
    box-shadow: 0 0 14px rgba(92, 200, 255, .45);
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    transition: opacity .12s ease;
  }

  .trackpad-cursor.is-visible { opacity: 1; }

  .trackpad-actions {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .trackpad-actions .btn { min-height: 48px; font-size: 12px; }

  /* ---- toast / caption ------------------------------------------------- */
  .toast {
    position: absolute;
    left: 50%;
    bottom: calc(18px + env(safe-area-inset-bottom));
    z-index: 70;
    transform: translate(-50%, 10px);
    opacity: 0;
    pointer-events: none;
    max-width: calc(100% - 30px);
    padding: 9px 13px;
    border-radius: 999px;
    background: #000;
    color: #fff;
    font-size: 12px;
    text-align: center;
    transition: opacity .15s ease, transform .15s ease;
  }

  .toast.is-visible {
    opacity: .92;
    transform: translate(-50%, 0);
  }

  .caption {
    margin: 0;
    color: #73869a;
    font-size: 12px;
    text-align: center;
  }

  /* ---- compact height / landscape -------------------------------------- */
  @media (max-height: 740px) {
    :root { --pad-size: clamp(180px, 28dvh, 230px); }
    .head { min-height: 44px; }
    .tab { min-height: 41px; }
    .media-row .btn { min-height: 38px; }
    .type-keys .btn { min-height: 44px; }
  }

  @media (orientation: landscape) and (max-height: 600px) {
    #controls.is-active {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr auto;
      grid-template-areas:
        "pad quick"
        "pad media";
      column-gap: 12px;
      row-gap: 10px;
    }
    #controls .controls-main { display: contents; }
    #controls .pad {
      grid-area: pad;
      align-self: center;
      justify-self: center;
      width: min(40dvh, 240px);
      height: min(40dvh, 240px);
    }
    #controls .quick {
      grid-area: quick;
      align-self: end;
    }
    #controls .media { grid-area: media; }
    #shortcuts .apps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    #trackpad .trackpad { min-height: 0; }
  }

  @media (max-width: 600px) {
    .stage {
      display: block;
      padding: 0;
    }
    .phone {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .caption { display: none; }
    body { overflow: hidden; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="phone">
      <div class="shell">
        <header class="head">
          <div class="brand">TRAVEL LAB</div>
          <div class="status"><span class="dot"></span>TV ready</div>
        </header>

        <nav class="tabs" role="tablist" aria-label="Remote sections">
          <button class="tab is-active" data-tab="controls" role="tab" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="4"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
            Controls
          </button>
          <button class="tab" data-tab="shortcuts" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="4" width="6" height="6" rx="1.4"/>
              <rect x="14" y="4" width="6" height="6" rx="1.4"/>
              <rect x="4" y="14" width="6" height="6" rx="1.4"/>
              <rect x="14" y="14" width="6" height="6" rx="1.4"/>
            </svg>
            Shortcuts
          </button>
          <button class="tab" data-tab="type" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3" y="6" width="18" height="12" rx="2"/>
              <path d="M6.5 9.5h.01M9.5 9.5h.01M12.5 9.5h.01M15.5 9.5h.01M18 9.5h.01M6.5 12.5h.01M9.5 12.5h.01M12.5 12.5h.01M15.5 12.5h.01M18 12.5h.01M8 15.5h8"/>
            </svg>
            Type
          </button>
          <button class="tab" data-tab="trackpad" role="tab" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="14" rx="3"/>
              <path d="M11 8.5l4 2.8-1.9.6 1.3 2.1-1.3.8-1.3-2.1-1.5 1.5z" fill="currentColor" stroke="none"/>
            </svg>
            Trackpad
          </button>
        </nav>

        <main class="panels">
          <section class="panel is-active" id="controls" role="tabpanel">
            <div class="controls-main">
              <div class="pad" aria-label="Directional pad">
                <button class="key" style="grid-area:1/2" aria-label="Up">▲</button>
                <button class="key" style="grid-area:2/1" aria-label="Left">◀</button>
                <button class="key key--ok" style="grid-area:2/2" aria-label="OK">OK</button>
                <button class="key" style="grid-area:2/3" aria-label="Right">▶</button>
                <button class="key" style="grid-area:3/2" aria-label="Down">▼</button>
              </div>
              <div class="quick">
                <button class="btn" data-toast="Back (Alt+Left)">← Back</button>
                <button class="btn" data-toast="Home (Alt+Home)">⌂ Home</button>
                <button class="btn" data-toast="Left click">Click</button>
                <button class="btn" data-toast="Right click">R-click</button>
                <button class="btn" data-toast="Scroll up">Scroll ↑</button>
                <button class="btn" data-toast="Scroll down">Scroll ↓</button>
              </div>
            </div>

            <div class="media">
              <div class="media-row">
                <button class="btn" data-toast="Play / pause (Space)">Play / Pause</button>
                <button class="btn" data-toast="Mute">Mute</button>
              </div>
              <label class="volume">
                <span>Vol</span>
                <input id="volume" type="range" min="0" max="100" value="40">
                <output id="volume-out">40%</output>
              </label>
            </div>
          </section>

          <section class="panel" id="shortcuts" role="tabpanel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">OPEN ON THE TV</div>
                <div class="panel-title">Apps</div>
              </div>
              <div class="hint">Tap to launch</div>
            </div>
            <div class="apps">
              <button class="app" style="--accent:#AA5CC3" data-toast="Opening Jellyfin…">Jellyfin</button>
              <button class="app" style="--accent:#FF0033" data-toast="Opening YouTube…">YouTube</button>
              <button class="app" style="--accent:#E50914" data-toast="Opening Netflix…">Netflix</button>
              <button class="app" style="--accent:#113CCF" data-toast="Opening Disney+…">Disney+</button>
              <button class="app" style="--accent:#00A6A6" data-toast="Opening Read…">Read</button>
              <button class="app" style="--accent:#FFC46B" data-toast="Opening Wi-Fi…">Wi-Fi</button>
              <button class="app" style="--accent:#1DB954" data-toast="Opening Spotify…">Spotify</button>
              <button class="app" style="--accent:#7CC7FF" data-toast="Opening Weather…">Weather</button>
              <button class="app" style="--accent:#E76F51" data-toast="Opening Radio…">Radio</button>
              <button class="app" style="--accent:#2638C4" data-toast="Opening PBS Kids…">PBS Kids</button>
            </div>
          </section>

          <section class="panel" id="type" role="tabpanel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">SEND TO THE TV</div>
                <div class="panel-title">Type</div>
              </div>
              <div class="hint">Focused field</div>
            </div>

            <form class="type-form" id="type-form">
              <div class="type-compose">
                <textarea class="type-input" id="type-input" rows="3"
                          placeholder="Type into the TV…"
                          autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
                <button class="btn btn--primary" type="submit">Send to TV</button>
              </div>

              <div class="type-keys">
                <button class="btn" data-toast="Enter sent">Enter</button>
                <button class="btn" data-toast="Backspace sent">Backspace</button>
                <button class="btn" data-toast="Space sent">Space</button>
                <button class="btn" data-toast="Tab sent">Tab</button>
                <button class="btn" data-toast="Escape sent">Escape</button>
                <button class="btn" id="clear-type">Clear</button>
              </div>

              <p class="type-hint">Text goes to whatever field has focus on the TV. The phone keyboard only appears on this tab.</p>
            </form>
          </section>

          <section class="panel" id="trackpad" role="tabpanel">
            <div class="panel-head">
              <div>
                <div class="eyebrow">LAST RESORT</div>
                <div class="panel-title">Trackpad</div>
              </div>
              <div class="hint">Drag · tap</div>
            </div>

            <div class="trackpad" id="trackpad-surface" role="button" tabindex="0" aria-label="Trackpad">
              <span class="trackpad-label">TRACKPAD</span>
              <span class="trackpad-hint">Drag to move · Tap to click</span>
              <span class="trackpad-cursor" id="trackpad-cursor"></span>
            </div>

            <div class="trackpad-actions">
              <button class="btn" data-toast="Left click">Click</button>
              <button class="btn" data-toast="Right click">Right click</button>
              <button class="btn" data-toast="Scroll up">Scroll ↑</button>
              <button class="btn" data-toast="Scroll down">Scroll ↓</button>
            </div>
          </section>
        </main>
      </div>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>

    <p class="caption">iPhone 13 mini · 375 × 812 · tap the tabs</p>
  </div>

<script>
  const tabs = Array.from(document.querySelectorAll('[data-tab]'));
  const panels = Array.from(document.querySelectorAll('.panel'));
  const toastEl = document.getElementById('toast');
  const volume = document.getElementById('volume');
  const volumeOut = document.getElementById('volume-out');
  const typeForm = document.getElementById('type-form');
  const typeInput = document.getElementById('type-input');
  const clearType = document.getElementById('clear-type');
  const trackpad = document.getElementById('trackpad-surface');
  const cursor = document.getElementById('trackpad-cursor');
  let toastTimer = null;

  function showToast(message) {
    if (!toastEl) return;
    toastEl.textContent = message;
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 1500);
  }

  tabs.forEach((tab) => {
    tab.addEventListener('click', () => {
      const name = tab.dataset.tab;
      tabs.forEach((item) => {
        const active = item === tab;
        item.classList.toggle('is-active', active);
        item.setAttribute('aria-selected', String(active));
      });
      panels.forEach((panel) => {
        panel.classList.toggle('is-active', panel.id === name);
      });
    });
  });

  document.querySelectorAll('[data-toast]').forEach((button) => {
    button.addEventListener('click', () => showToast(button.dataset.toast));
  });

  volume.addEventListener('input', () => {
    volumeOut.textContent = `${volume.value}%`;
  });

  typeForm.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = typeInput.value.trim();
    if (!text) {
      typeInput.focus();
      return;
    }
    showToast(`Typing: ${text}`);
  });

  clearType.addEventListener('click', () => {
    typeInput.value = '';
    typeInput.focus();
  });

  // A tiny visual cursor so the mockup demonstrates relative movement.
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  let moved = 0;

  function placeCursor(event) {
    const rect = trackpad.getBoundingClientRect();
    const x = Math.max(8, Math.min(rect.width - 8, event.clientX - rect.left));
    const y = Math.max(8, Math.min(rect.height - 8, event.clientY - rect.top));
    cursor.style.left = `${x}px`;
    cursor.style.top = `${y}px`;
    cursor.classList.add('is-visible');
  }

  trackpad.addEventListener('pointerdown', (event) => {
    dragging = true;
    moved = 0;
    lastX = event.clientX;
    lastY = event.clientY;
    trackpad.classList.add('is-active');
    placeCursor(event);
    try { trackpad.setPointerCapture(event.pointerId); } catch (_) { /* noop */ }
    event.preventDefault();
  });

  trackpad.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    moved += Math.abs(event.clientX - lastX) + Math.abs(event.clientY - lastY);
    lastX = event.clientX;
    lastY = event.clientY;
    placeCursor(event);
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    trackpad.classList.remove('is-active');
    showToast(moved < 6 ? 'Tap → left click' : 'Pointer moved');
  }

  trackpad.addEventListener('pointerup', endDrag);
  trackpad.addEventListener('pointercancel', endDrag);
</script>
</body>
</html>
