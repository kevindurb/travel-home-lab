---
# ---------------------------------------------------------------------------
# travel lab -- non-secret stack configuration
# ---------------------------------------------------------------------------
# Single source of truth for the stack: tailnet domain, storage path, service
# ports, images and the service list. Change a value here and re-run
# `just deploy`.
#
# There are no secrets in this stack: ingress is Tailscale Services (real,
# Tailscale-issued certificates) and nothing here authenticates to anything.

# --- identity ---------------------------------------------------------------
travel_lab_user: kevindurb
# Tailnet MagicDNS suffix. Each Service is exposed as
# https://<service>.<tailnet-domain>, e.g. travel-kiwix.beaver-cloud.ts.net.
travel_lab_tailnet_domain: beaver-cloud.ts.net
travel_lab_storage: /mnt/storage

# --- paths on the Pi --------------------------------------------------------
# Derived from facts, which are gathered as the SSH user (the deploy play runs
# with become off), so these resolve to kevindurb's home. The quadlet units
# themselves use the systemd `%h` specifier, so they stay username-agnostic.
travel_lab_home: "{{ ansible_facts.user_dir }}"
travel_lab_uid: "{{ ansible_facts.user_uid }}"
travel_lab_config_root: "{{ travel_lab_home }}/.config"
travel_lab_unit_dir: "{{ travel_lab_config_root }}/containers/systemd"

# Environment needed to talk to the *user* systemd manager (and rootless
# podman) from a non-interactive SSH session. Linger=yes guarantees the
# runtime dir exists even when nobody is logged in.
travel_lab_user_env:
  XDG_RUNTIME_DIR: "/run/user/{{ travel_lab_uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ travel_lab_uid }}/bus"

# --- behaviour --------------------------------------------------------------
# When true: enable podman-auto-update.timer (user scope) and stamp
# `AutoUpdate=registry` into every unit. When false: `AutoUpdate=none` and the
# timer is left alone.
travel_lab_auto_update: true

travel_lab_network: travel-home-lab

# --- ingress: Tailscale Services --------------------------------------------
# One Tailscale Service per app, replacing the old Caddy reverse proxy. Each
# container publishes its port on 127.0.0.1:<local_port>; `tailscale serve`
# terminates TLS on tailscale0:443 and proxies to that loopback port, so no
# privileged ports and no internal CA.
#
# This mapping is the single source of truth for the quadlet PublishPort lines,
# the `tailscale serve` declarations, and the homer/gatus URLs. local_port is
# the *host* port; the container port is written in each quadlet.
#
# Adding a service: add it here, add its quadlet to travel_lab_units, and
# define svc:<service> in the Tailscale admin console (see
# docs/tailscale-serve-migration.md).
travel_lab_tailscale_services:
  kiwix:    { service: travel-kiwix,    local_port: 18080 }
  jellyfin: { service: travel-jellyfin, local_port: 18096 }
  gatus:    { service: travel-gatus,    local_port: 18081 }
  glances:  { service: travel-glances,  local_port: 18108 }
  dozzle:   { service: travel-dozzle,   local_port: 18082 }
  homer:    { service: travel-home,     local_port: 18083 }
  whoami:   { service: travel-whoami,   local_port: 18084 }

# --- images -----------------------------------------------------------------
# Pinned to :latest to match the stack's long-standing behaviour. To pin, just
# replace the tag here (see docs/ansible-migration.md for the caveat around the
# stateful services, jellyfin in particular).
travel_lab_images:
  dozzle: docker.io/amir20/dozzle:latest
  gatus: ghcr.io/twin/gatus:latest
  glances: docker.io/nicolargo/glances:latest
  homer: docker.io/b4bz/homer:latest
  jellyfin: docker.io/jellyfin/jellyfin:latest
  kiwix: ghcr.io/kiwix/kiwix-serve:latest
  whoami: docker.io/traefik/whoami:latest

# --- service shape ----------------------------------------------------------
# Container quadlet units, in start order. The volume and network units are
# pulled in as dependencies of these.
travel_lab_containers:
  - kiwix
  - jellyfin
  - gatus
  - dozzle
  - glances
  - homer
  - whoami

# Every quadlet unit rendered into travel_lab_unit_dir (containers + volumes +
# network). Each maps to templates/quadlets/<name>.j2. The `.volume` file names
# are referenced by the container units, so they must not change.
travel_lab_units:
  - travel-home-lab.network
  - jellyfin_config.volume
  - gatus_data.volume
  - dozzle_data.volume
  - dozzle.container
  - gatus.container
  - glances.container
  - homer.container
  - jellyfin.container
  - kiwix.container
  - whoami.container
