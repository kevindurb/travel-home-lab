# Radio page stations. Use HTTPS URLs where possible; CPR News is proxied by
# the travel-tv Go app because its stream is HTTP-only.
travel_lab_radio_stations:
  - id: groove-salad
    name: Groove Salad
    subtitle: SomaFM
    accent: "#7FB2A6"
    url: "https://ice1.somafm.com/groovesalad-128-mp3"
  - id: drone-zone
    name: Drone Zone
    subtitle: SomaFM
    accent: "#6C8EBF"
    url: "https://ice1.somafm.com/dronezone-128-mp3"
  - id: nts-1
    name: NTS 1
    subtitle: London
    accent: "#E4572E"
    url: "https://stream-relay-geo.ntslive.net/stream"
  - id: radio-paradise
    name: Radio Paradise
    subtitle: Eclectic
    accent: "#3A7CA5"
    url: "https://stream.radioparadise.com/aac-320"
  - id: cpr-news
    name: CPR News
    subtitle: Colorado
    accent: "#1B998B"
    url: "/radio/cpr-news"
  - id: kuvo
    name: KUVO Jazz
