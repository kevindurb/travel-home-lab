---
# ---------------------------------------------------------------------------
# travel lab -- non-secret stack configuration
# ---------------------------------------------------------------------------
# Single source of truth for the stack: tailnet domain, storage path, service
# ports, images and the service list. Change a value here and re-run
# `just deploy`.
#
# There are no secrets in this stack: ingress is Tailscale Services (real,
# Tailscale-issued certificates) and nothing here authenticates to anything.

# --- identity ---------------------------------------------------------------
travel_lab_user: kevindurb
# Tailnet MagicDNS suffix. Each Service is exposed as
# https://<service>.<tailnet-domain>, e.g. travel-kiwix.beaver-cloud.ts.net.
travel_lab_tailnet_domain: beaver-cloud.ts.net
travel_lab_storage: /mnt/storage
travel_lab_jellyfin_state: "{{ travel_lab_storage }}/jellyfin"
# Containers that must not start while /mnt/storage is absent.
travel_lab_storage_containers:
  - jellyfin
  - kiwix

# --- paths on the Pi --------------------------------------------------------
# Derived from facts, which are gathered as the SSH user (the deploy play runs
# with become off), so these resolve to kevindurb's home. The quadlet units
# themselves use the systemd `%h` specifier, so they stay username-agnostic.
travel_lab_home: "{{ ansible_facts.user_dir }}"
travel_lab_uid: "{{ ansible_facts.user_uid }}"
travel_lab_config_root: "{{ travel_lab_home }}/.config"
travel_lab_unit_dir: "{{ travel_lab_config_root }}/containers/systemd"

# Environment needed to talk to the *user* systemd manager (and rootless
# podman) from a non-interactive SSH session. Linger=yes guarantees the
# runtime dir exists even when nobody is logged in.
travel_lab_user_env:
  XDG_RUNTIME_DIR: "/run/user/{{ travel_lab_uid }}"
  DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ travel_lab_uid }}/bus"

# --- behaviour --------------------------------------------------------------
# When true: enable podman-auto-update.timer (user scope) and stamp
# `AutoUpdate=registry` into every unit. When false: `AutoUpdate=none` and the
# timer is left alone.
travel_lab_auto_update: true

travel_lab_network: travel-home-lab

# --- Travel TV (HDMI kiosk) -------------------------------------------------
# The 10ft launcher and phone remote are one Go app, fronted by
# svc:travel-tv. The Pi's HDMI output runs Cage + Firefox at boot. See
# docs/hdmi-tv.md.
travel_lab_tv_url: "https://{{ travel_lab_tailscale_services.tv.service }}.{{ travel_lab_tailnet_domain }}"
travel_lab_tv_config: "{{ travel_lab_config_root }}/travel-tv/config.yml"
travel_lab_tv_profile: "{{ travel_lab_home }}/.local/share/travel-tv/firefox"
# Short URL encoded in the launcher QR; the Go app serves remote.html for /r.
travel_lab_tv_remote_qr_url: "{{ travel_lab_tv_url }}/r"
# Port the Go app listens on inside the container. The host-facing loopback
# port stays travel_lab_tailscale_services.tv.local_port (18085).
travel_lab_tv_listen_port: 8080
# The launcher grid uses a fixed number of columns; the remote needs it to
# turn an app tile index into arrow-key presses.
travel_lab_tv_grid_columns: 4
# How long to wait after Alt+Home before sending the app-grid arrows. Raise it
# if app launching misses on a slow TV page.
travel_lab_tv_remote_settle_ms: 2000
# Raspberry Pi OS ships `firefox`; switch both values to firefox-esr if the
# image only has Debian's ESR package.
travel_lab_tv_firefox_package: firefox
travel_lab_tv_firefox_bin: firefox
# qrencode is no longer needed: the Go app renders both QR codes from the
# rendered config at startup. The PSK lives only in that 0600 config file.

# --- Moonlight (game streaming) --------------------------------------------
# moonlight-web-stream (Rust) runs on the Pi and relays a Sunshine host to the
# kiosk's Firefox over WebRTC. The kiosk loads it from the loopback publish:
# 127.0.0.1 counts as a secure context, so the Gamepad, pointer-lock and
# WebSocket APIs all work, and the request never goes through `tailscale serve`
# (whose HTTP proxy has open WebSocket bugs: tailscale#20882, #18827). The
# WebRTC media is UDP, so those ports are published on the tailnet address as
# well and advertised as the ICE candidate. See docs/moonlight.md.
travel_lab_moonlight_port: 18086
travel_lab_moonlight_url: "http://127.0.0.1:{{ travel_lab_moonlight_port }}"
travel_lab_moonlight_config: "{{ travel_lab_config_root }}/moonlight"
# Port the bridge listens on inside the container.
travel_lab_moonlight_listen_port: 8080
# UDP range for WebRTC media, one port per stream slot. It must match
# WEBRTC_PORT_RANGE in the quadlet and the published range.
travel_lab_moonlight_webrtc_port_min: 40000
travel_lab_moonlight_webrtc_port_max: 40100

# Weather tile / forecast page. Leave lat/lon/city empty to resolve the
# location from the travel router's public IP; set them to pin a location.
travel_lab_weather_units: fahrenheit
travel_lab_weather_latitude: ""
travel_lab_weather_longitude: ""
travel_lab_weather_city: ""

# The real values live in the encrypted host_vars/travel-lab/vault.yml. These
# placeholders keep the page renderable before the vault is filled in.
travel_lab_wifi_ssid: "REPLACE_ME"
travel_lab_wifi_psk: "REPLACE_ME"
travel_lab_wifi_security: WPA
travel_lab_wifi_hidden: false
travel_lab_tv_wifi_placeholder: >-
  {{ travel_lab_wifi_ssid == 'REPLACE_ME' or travel_lab_wifi_psk == 'REPLACE_ME' }}

travel_lab_tv_tiles:
  - id: jellyfin
    label: Jellyfin
    icon: jellyfin
    accent: "#AA5CC3"
    url: "https://{{ travel_lab_tailscale_services.jellyfin.service }}.{{ travel_lab_tailnet_domain }}"
