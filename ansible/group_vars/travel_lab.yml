  - id: disney
    label: Disney+
    icon: disney
    accent: "#113CCF"
    url: "https://www.disneyplus.com/"
  - id: read
    label: Read
    icon: kiwix
    accent: "#00A6A6"
    url: "https://{{ travel_lab_tailscale_services.kiwix.service }}.{{ travel_lab_tailnet_domain }}"
  - id: wifi
    label: Wi-Fi
    icon: wifi
    accent: "#FFC46B"
    action: wifi
    url: "wifi.html"
  - id: spotify
    label: Spotify
    icon: spotify
    accent: "#1DB954"
    url: "https://open.spotify.com/"
  - id: weather
    label: Weather
    accent: "#7CC7FF"
    action: weather
    url: "forecast.html"
  - id: radio
    label: Radio
    icon: radio
    accent: "#E76F51"
    url: "radio.html"
  - id: pbskids
    label: PBS Kids
    icon: pbskids
