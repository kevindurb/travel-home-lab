---
# Stop the stack and remove the quadlet units this repo manages.
#
#   ansible-playbook teardown.yml
#
# This deliberately does NOT touch:
#   * named volumes (jellyfin_config, gatus_data, caddy_data, caddy_config,
#     dozzle_data) -- they hold real state, see README.md
#   * images
#   * the rendered config files under ~/.config/{caddy,gatus,homer}
#   * the Pi's clone of this repo, if any
#
- name: Tear down the travel lab stack
  hosts: travel_lab
  become: false
  tasks:
    - name: Stop the container units
      ansible.builtin.systemd_service:
        name: "{{ item }}.service"
        state: stopped
        scope: user
      loop: "{{ travel_lab_containers }}"
      failed_when: false
      environment: "{{ travel_lab_user_env }}"

    - name: Remove the rendered quadlet units
      ansible.builtin.file:
        path: "{{ travel_lab_unit_dir }}/{{ item }}"
        state: absent
      loop: "{{ travel_lab_units }}"

    - name: Reload systemd so the generated units disappear
      ansible.builtin.systemd_service:
        daemon_reload: true
        scope: user
      environment: "{{ travel_lab_user_env }}"

    - name: Report what was left behind
      ansible.builtin.debug:
        msg:
          - "Units removed; images and volumes untouched."
          - >-
            Rendered configs remain in {{ travel_lab_config_root }}/
            (caddy, gatus, homer).
