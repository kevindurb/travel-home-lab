[defaults]
# Non-interactive vault unlock for host_vars/travel-lab/vault.yml.
# The password file lives outside the repo; see docs/hdmi-tv.md.
vault_password_file = ~/.vault_pass
filter_plugins = ./filter_plugins
interpreter_python=auto_silent
host_key_checking=False
deprecation_warnings=False
forks=10
inventory=./inventory/prod.yml
pipelining=True

[ssh_connection]
retries=3
