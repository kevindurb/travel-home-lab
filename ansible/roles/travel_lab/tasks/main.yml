---
# Deploy the stack as the user. No become: the quadlets are rootless user
# units, so every systemctl/podman command talks to kevindurb's user manager
# (travel_lab_user_env supplies XDG_RUNTIME_DIR / the session bus).
#
# Ingress is Tailscale Services: containers publish on 127.0.0.1 only and
# `tailscale serve` fronts them. That needs no privilege because host-prep sets
# kevindurb as the tailscaled operator.

- name: Ensure the rootless podman socket is available
  ansible.builtin.systemd_service:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  environment: "{{ travel_lab_user_env }}"

- name: Create the config directories
  ansible.builtin.file:
    path: "{{ travel_lab_config_root }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ travel_lab_configs.keys() | list }}"

- name: Create the quadlet unit directory
  ansible.builtin.file:
    path: "{{ travel_lab_unit_dir }}"
    state: directory
    mode: "0755"

# The Pi health collector is a user timer, so both its binary and its units
# live under the stack user's home.
- name: Create the local bin directory
  ansible.builtin.file:
    path: "{{ travel_lab_home }}/.local/bin"
    state: directory
    mode: "0755"

- name: Create the user systemd unit directory
  ansible.builtin.file:
    path: "{{ travel_lab_config_root }}/systemd/user"
    state: directory
    mode: "0755"

# moonlight-web-stream keeps data.json (users, pairings, settings) in
# <root>/server, which is bind-mounted from here.
- name: Create the Moonlight data directory
  ansible.builtin.file:
    path: "{{ travel_lab_moonlight_config }}"
    state: directory
    mode: "0755"

# The Moonlight media ports are UDP, which `tailscale serve` cannot proxy, so
# they are published on the tailnet address and advertised as the WebRTC ICE
# candidates. Read it before rendering the quadlets (also in --check, where
# command tasks would otherwise be skipped).
- name: Read the Pi's Tailscale IPv4 address
  ansible.builtin.command: tailscale ip -4
  register: travel_lab_tailscale_ip_cmd
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require a Tailscale IPv4 address
  ansible.builtin.assert:
    that:
      - travel_lab_tailscale_ip_cmd.rc == 0
      - travel_lab_tailscale_ip_cmd.stdout | trim | length > 0
    fail_msg: >-
      `tailscale ip -4` returned no address. The Moonlight WebRTC media ports
      must bind to the tailnet address; make sure tailscaled is running.

- name: Record the Tailscale IPv4 address
  ansible.builtin.set_fact:
    travel_lab_tailnet_ip: "{{ travel_lab_tailscale_ip_cmd.stdout_lines | first | trim }}"

# --- render -----------------------------------------------------------------
- name: Render the service config files
  ansible.builtin.template:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
    mode: "{{ item.value.mode | default('0644') }}"
  loop: "{{ travel_lab_configs | dict2items }}"
  loop_control:
    label: "{{ item.value.dest }}"
  no_log: "{{ item.value.secret | default(false) }}"
  register: travel_lab_config_render

- name: Render the quadlet units
  ansible.builtin.template:
    src: "quadlets/{{ item }}.j2"
    dest: "{{ travel_lab_unit_dir }}/{{ item }}"
    mode: "0644"
  loop: "{{ travel_lab_units }}"
  notify: Reload the user systemd manager
  register: travel_lab_units_render

- name: Install the Pi health collector
  ansible.builtin.template:
    src: pi-health.sh.j2
    dest: "{{ travel_lab_home }}/.local/bin/pi-health"
    mode: "0755"

- name: Render the Pi health systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ travel_lab_config_root }}/systemd/user/{{ item }}"
    mode: "0644"
  loop:
    - pi-health.service
    - pi-health.timer
  notify: Reload the user systemd manager
  register: travel_lab_pi_health_units_render

- name: Generate the systemd units before starting anything
  ansible.builtin.meta: flush_handlers

# --- storage ----------------------------------------------------------------
# The NVMe is optional at deploy time. Jellyfin and Kiwix must not start on a
# bare /mnt/storage directory, so they are skipped while it is absent.
- name: Check whether the storage volume is mounted
  ansible.builtin.command: /usr/bin/mountpoint -q {{ travel_lab_storage }}
  register: travel_lab_storage_check
  changed_when: false
  failed_when: false

- name: Record storage availability
  ansible.builtin.set_fact:
    travel_lab_storage_available: "{{ travel_lab_storage_check.rc == 0 }}"

# The throwaway Jellyfin cache lives on the SSD; only create it when the
# storage is actually mounted, so it never lands on the SD card root.
- name: Create the Jellyfin cache directory
  ansible.builtin.file:
    path: "{{ travel_lab_jellyfin_state }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: [cache]
  when: travel_lab_storage_available | bool

- name: Warn when storage is not mounted
  ansible.builtin.debug:
    msg:
      - "{{ travel_lab_storage }} is not mounted."
      - "Jellyfin and Kiwix will be left stopped; everything else still deploys."
      - "Connect the storage and re-run `just deploy` (or start both units manually)."
  when: not (travel_lab_storage_available | bool)

- name: Choose the containers to start
  ansible.builtin.set_fact:
    travel_lab_start_containers: >-
      {{ travel_lab_containers | difference(travel_lab_storage_containers)
         if not (travel_lab_storage_available | bool)
         else travel_lab_containers }}

- name: Stop storage containers while the volume is absent
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: stopped
    scope: user
  loop: "{{ travel_lab_storage_containers }}"
  when: not (travel_lab_storage_available | bool)
  environment: "{{ travel_lab_user_env }}"

# A unit that failed before ConditionPathIsMountPoint existed stays in the
# "failed" state even after a successful stop; clear it so status is inactive.
- name: Clear stale failed state on storage containers
  ansible.builtin.command: systemctl --user reset-failed {{ item }}
  loop: "{{ travel_lab_storage_containers }}"
  when: not (travel_lab_storage_available | bool)
  changed_when: false
  environment: "{{ travel_lab_user_env }}"

# --- run --------------------------------------------------------------------
- name: Start the stack
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
    scope: user
  loop: "{{ travel_lab_start_containers }}"
  environment: "{{ travel_lab_user_env }}"

- name: Note which container units changed
  ansible.builtin.set_fact:
    travel_lab_changed_containers: >-
      {{ travel_lab_units_render.results
         | selectattr('changed')
         | map(attribute='item')
         | select('search', '\.container$')
         | map('regex_replace', '\.container$', '')
         | list }}

# A running container keeps its old ExecStart until it is restarted, so a unit
# whose file changed (a new PublishPort, a new image tag, ...) only takes
# effect after a restart. `daemon-reload` alone is not enough.
- name: Restart containers whose unit changed
  ansible.builtin.systemd_service:
    name: "{{ item.item | regex_replace('\\.container$', '') }}.service"
    state: restarted
    scope: user
  loop: "{{ travel_lab_units_render.results | selectattr('changed') | list }}"
  when:
    - item.item.endswith('.container')
    - >-
      (travel_lab_storage_available | bool)
      or ((item.item | regex_replace('\.container$', '')) not in travel_lab_storage_containers)
  loop_control:
    label: "{{ item.item }}"
  environment: "{{ travel_lab_user_env }}"

- name: Restart services whose config changed
  ansible.builtin.systemd_service:
    name: "{{ item.item.key }}.service"
    state: restarted
    scope: user
  loop: "{{ travel_lab_config_render.results | selectattr('changed') | list }}"
  when: item.item.key not in travel_lab_changed_containers
  loop_control:
    label: "{{ item.item.key }}"
  environment: "{{ travel_lab_user_env }}"

# Start the collector after the stack so its first pushes find Gatus ready.
- name: Enable and start the Pi health timer
  ansible.builtin.systemd_service:
    name: pi-health.timer
    enabled: true
    state: started
    scope: user
  environment: "{{ travel_lab_user_env }}"

# An active timer keeps its old schedule after a unit change, so restart it
# once Gatus is running with the new config.
- name: Restart the Pi health timer when its unit changed
  ansible.builtin.systemd_service:
    name: pi-health.timer
    state: restarted
    scope: user
  when: travel_lab_pi_health_units_render is changed
  environment: "{{ travel_lab_user_env }}"

# --- ingress ----------------------------------------------------------------
# Ingress is Tailscale Services, declared with the CLI. The huJSON config file
# is *not* used: its endpoints only accept `tcp:<port>` keys, and tcp:443 with
# an http:// target yields a plaintext HTTP listener (status shows
# {"443":{"HTTP":true}}), with no way to request HTTPS. `--https=443` sets
# {"443":{"HTTPS":true}} — TLS terminated by tailscaled, plain HTTP to the
# container — and advertises the Service in the same step (Tailscale's
# recommended method). Writes need no privilege: host-prep sets the operator.
- name: Read the live Tailscale Serve status
  ansible.builtin.command: tailscale serve status --json
  register: travel_lab_serve_status
  changed_when: false
  failed_when: false

- name: Parse the live Services
  ansible.builtin.set_fact:
    travel_lab_live_services: >-
      {{ (travel_lab_serve_status.stdout | from_json).Services
         if (travel_lab_serve_status.stdout | default('')) is search('"Services"')
         else {} }}

# Re-run only when the Service is not already HTTPS on the right local port.
# `clear` first because Tailscale refuses to flip a Service from HTTP to HTTPS
# on the same port in place (the state the retired svc:travel-jellyfin test was
# left in). Each svc:<name> must exist in the admin console; see
# docs/tailscale-serve-migration.md §8.
- name: Publish each Service over HTTPS
  ansible.builtin.shell: |
    tailscale serve clear svc:{{ item.value.service }} >/dev/null 2>&1 || true
    tailscale serve --service=svc:{{ item.value.service }} --https=443 \
      http://127.0.0.1:{{ item.value.local_port }}
  loop: "{{ travel_lab_tailscale_services | dict2items }}"
  loop_control:
    label: "{{ item.value.service }}"
  vars:
    live: "{{ travel_lab_live_services.get('svc:' ~ item.value.service, {}) }}"
  when: >-
    (live.get('TCP', {}).get('443', {}).get('HTTPS', false) | bool) == false
    or (((live.get('Web', {})).values() | list | first)
        .get('Handlers', {}).get('/', {}).get('Proxy', '')
        != 'http://127.0.0.1:' ~ item.value.local_port)
  changed_when: true

- name: Enable the podman auto-update timer
  ansible.builtin.systemd_service:
    name: podman-auto-update.timer
    enabled: true
    state: started
    scope: user
  when: travel_lab_auto_update | bool
  environment: "{{ travel_lab_user_env }}"
