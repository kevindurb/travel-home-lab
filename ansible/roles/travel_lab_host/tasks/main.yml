---
# Host prerequisites. Runs escalated (become: true); see host-prep.yml /
# site.yml. Every task here is idempotent and none of them touch container
# state or volumes.
#
# The old privileged-port sysctl (for Caddy's :443) is gone: ingress is now
# Tailscale Services, which bind :443 on tailscale0 as root, and the containers
# publish only 127.0.0.1:<high port>.

- name: Read the Podman version
  ansible.builtin.command: podman --version
  register: travel_lab_host_podman_version
  changed_when: false

- name: Require Podman 5 or newer (quadlet support)
  ansible.builtin.assert:
    that:
      - >-
        (travel_lab_host_podman_version.stdout
         | regex_search('[0-9]+\.[0-9]+\.[0-9]+')) is version('5.0.0', '>=')
    fail_msg: >-
      Podman {{ travel_lab_host_podman_version.stdout }} is too old; this stack
      needs quadlets (Podman >= 5).

- name: Assert the storage volume is mounted
  ansible.builtin.assert:
    that:
      - >-
        travel_lab_storage in
        (ansible_facts.mounts | map(attribute='mount') | list)
    fail_msg: >-
      {{ travel_lab_storage }} is not a mountpoint. Jellyfin and Kiwix read
      from it; refusing to proceed so they do not start on a bare directory.

- name: Read /etc/fstab
  ansible.builtin.slurp:
    src: /etc/fstab
  register: travel_lab_host_fstab

- name: Assert the storage volume is in /etc/fstab
  ansible.builtin.assert:
    that:
      - travel_lab_storage in (travel_lab_host_fstab.content | b64decode)
    fail_msg: >-
      {{ travel_lab_storage }} has no /etc/fstab entry; it would not be mounted
      after a reboot.

# Tailscale Serve writes need root unless the stack user is the tailscaled
# operator. Set it once so `deploy` can apply the Serve config with no sudo.
- name: Read the current Tailscale operator
  ansible.builtin.command: tailscale debug prefs
  register: travel_lab_host_tailscale_prefs
  changed_when: false
  failed_when: false

- name: Let {{ travel_lab_user }} manage Tailscale Serve without sudo
  ansible.builtin.command: tailscale set --operator={{ travel_lab_user }}
  when: >-
    travel_lab_host_tailscale_prefs.stdout is not search(
      '"OperatorUser": "' ~ travel_lab_user ~ '"')
  changed_when: true

- name: Read the current linger state
  ansible.builtin.command: loginctl show-user {{ travel_lab_user }} -p Linger
  register: travel_lab_host_linger
  changed_when: false
  failed_when: false

- name: Enable systemd linger so the user manager starts at boot
  ansible.builtin.command: loginctl enable-linger {{ travel_lab_user }}
  when: "'Linger=yes' not in travel_lab_host_linger.stdout"
  changed_when: true
