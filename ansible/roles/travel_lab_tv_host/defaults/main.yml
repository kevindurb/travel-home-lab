---
# Packages for the HDMI kiosk. Widevine is installed separately (it is not
# available on every Raspberry Pi OS image) so the kiosk still works without
# Netflix/Disney+ DRM.
# The travel-tv Go image bundles wtype and wlrctl; the host only needs the
# compositor, browser and audio services.
travel_lab_tv_host_packages:
  - cage
  - "{{ travel_lab_tv_firefox_package }}"
  - pipewire
  - pipewire-pulse
  - wireplumber
  - bluez
  # rfkill is a separate package on Bookworm; the Bluetooth radio ships
  # soft-blocked on Raspberry Pi OS and must be unblocked once.
  - rfkill
  - curl
  - kbd
  - ca-certificates
  - fonts-dejavu-core
  - libgl1-mesa-dri
