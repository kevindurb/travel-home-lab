---
# Install the Firefox kiosk profile and PipeWire endpoints. Runs as the stack
# user (no become); the kiosk itself is installed by the travel_lab_tv_host
# role in the host play. The launcher+remote Go app is the travel-tv quadlet
# owned by the travel_lab role, and its page data is the config file rendered
# by that role (roles/travel_lab/templates/travel-tv-config.yml.j2).

- name: Create the Firefox kiosk profile directories
  ansible.builtin.file:
    path: "{{ travel_lab_tv_profile }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - ""
    - chrome

# Write the prefs before the page becomes reachable so a first boot does not
# race into a fresh, chrome-laden Firefox profile.
- name: Install the Firefox kiosk preferences
  ansible.builtin.template:
    src: firefox/user.js.j2
    dest: "{{ travel_lab_tv_profile }}/user.js"
    mode: "0644"

- name: Install the Firefox chrome overrides
  ansible.builtin.copy:
    src: firefox/userChrome.css
    dest: "{{ travel_lab_tv_profile }}/chrome/userChrome.css"
    mode: "0644"

# --- legacy phone remote cleanup --------------------------------------------
# Before the Go app, the remote was a Python user service and nginx proxied
# /api/ to its Unix socket. Remove those artifacts on upgrade. The app itself
# is the travel-tv container owned by the travel_lab role.
- name: Stop the legacy Python phone-remote service
  ansible.builtin.systemd_service:
    name: travel-tv-remote.service
    state: stopped
    enabled: false
    scope: user
  failed_when: false
  environment: "{{ travel_lab_user_env }}"

- name: Remove the legacy Python remote, nginx config, socket and page directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ travel_lab_home }}/.config/systemd/user/travel-tv-remote.service"
    - "{{ travel_lab_home }}/.local/bin/travel-tv-remote"
    - "{{ travel_lab_config_root }}/travel-tv/nginx.conf"
    - "{{ travel_lab_config_root }}/travel-tv/run"
    # The pre-Go role rendered the launcher and QR SVGs into this directory.
    - "{{ travel_lab_config_root }}/travel-tv/www"

- name: Reload the user systemd manager after removing the legacy unit
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: not ansible_check_mode
  environment: "{{ travel_lab_user_env }}"

- name: Warn about placeholder Wi-Fi credentials
  ansible.builtin.debug:
    msg: >-
      Wi-Fi credentials are still placeholders. Run `just vault-edit` to set
      travel_lab_wifi_ssid and travel_lab_wifi_psk, then re-run `just deploy`.
  when: travel_lab_tv_wifi_placeholder | bool

# --- audio ------------------------------------------------------------------
# Firefox needs a PulseAudio/PipeWire endpoint for HDMI audio. These are user
# units; the user manager is already running because Linger=yes.
- name: Enable the PipeWire user services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    scope: user
  loop:
    - pipewire.socket
    - pipewire-pulse.socket
    - wireplumber.service
  environment: "{{ travel_lab_user_env }}"
