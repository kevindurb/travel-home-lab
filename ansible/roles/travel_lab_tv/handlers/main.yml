---
# User unit for the phone-remote API. The reload handler must run before the
# restart handler, so define it first.
- name: Reload the user systemd manager
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  environment: "{{ travel_lab_user_env }}"

- name: Restart the Travel TV remote API
  ansible.builtin.systemd_service:
    name: travel-tv-remote.service
    state: restarted
    scope: user
  environment: "{{ travel_lab_user_env }}"
  # In check mode the unit file above was not written, so systemd cannot find
  # the service yet.
  when: not ansible_check_mode
