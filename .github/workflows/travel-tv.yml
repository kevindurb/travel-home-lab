name: Travel TV image

on:
  push:
    branches: [main]
    paths:
      - "travel-tv/**"
      - ".github/workflows/travel-tv.yml"
  pull_request:
    paths:
      - "travel-tv/**"
      - ".github/workflows/travel-tv.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: travel-tv-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/kevindurb/travel-home-lab/travel-tv

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: travel-tv/go.mod
          cache-dependency-path: travel-tv/go.sum
      - name: Test
        working-directory: travel-tv
        run: go test ./...
      - name: Vet
        working-directory: travel-tv
        run: go vet ./...
      - name: Format
        working-directory: travel-tv
        run: test -z "$(gofmt -l .)"

  image:
    name: Build and push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./travel-tv
          file: ./travel-tv/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
