<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Lab &mdash; About</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="about">
  <header class="top">
    <a class="back" href="settings.html" data-back>&larr; Settings</a>
    <div class="when">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <main class="about">
    <div class="about-hero">
      <div class="about-title">Travel Lab</div>
      <div class="about-sub">
        {{.About.Model}}
        &middot; {{.About.Distribution}}
        {{.About.DistributionVersion}}
      </div>
    </div>

    <dl class="about-grid">
      <div class="about-item">
        <dt>Travel TV</dt>
        <dd id="about-version">{{.Version}}</dd>
      </div>
      <div class="about-item">
        <dt>Kernel</dt>
        <dd>{{.About.Kernel}}</dd>
      </div>
      <div class="about-item">
        <dt>Tailnet</dt>
        <dd>{{.About.Tailnet}}</dd>
      </div>
      <div class="about-item">
        <dt>Kiosk</dt>
        <dd>Cage + {{.About.Firefox}}</dd>
      </div>
    </dl>

    <div class="about-section-title">Services</div>
    <div class="about-services">
      {{range .About.Services}}
      <div class="about-service">
        <span class="about-service-name">{{.Name}}</span>
        <span class="about-service-url">{{.URL}}</span>
      </div>
      {{end}}
    </div>
  </main>

  <footer class="hints">
    <span><b>Esc</b> back</span>
    <span><b>Start</b> settings</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
